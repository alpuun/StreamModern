name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -la
          echo "ZIP files found:"
          find . -maxdepth 2 -type f -name "*.zip"

      - name: Show build instructions
        run: |
          echo "Repository checked successfully."
          echo "The Android project must be extracted before building the APK."
